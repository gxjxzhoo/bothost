name: image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load shared env (env-config)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
      - name: Apply shared env
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
          fi
          rm -rf .shared-env

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: gxjxzgx
          password: ${{ env.DOCKERHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/metadata-action@v5
        id: meta_hub
        with:
          images: docker.io/gxjxzgx/bothost
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_hub.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.meta_hub.outputs.labels }}

      - name: keep last 3 runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: image.yml
        run: |
          ids=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 100 --json databaseId -q '.[3:] | .[].databaseId')
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "deleted run $id"
          done
