name: build-image-python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/image-python.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 加载共享变量（env-config）
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Hub username
        id: dh
        shell: bash
        env:
          DH_TOKEN: ${{ env.DOCKERHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}
          DH_USER: ${{ env.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Docker Hub 不能只凭令牌查用户名: 依次用候选用户名 + DOCKERHUB_TOKEN 向 auth.docker.io 验证, 通过的就是真实用户名
          [ -z "$DH_TOKEN" ] && { echo "::error::DOCKERHUB_TOKEN 为空"; exit 1; }
          for u in $DH_USER gxjxzgx "$OWNER"; do
            u=$(echo "$u" | tr 'A-Z' 'a-z')
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "$u:$DH_TOKEN" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$u/python:push,pull")
            if [ "$code" = "200" ]; then
              echo "Docker Hub 用户名: $u"
              echo "user=$u" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "用户名 $u 验证失败 (HTTP $code)"
          done
          echo "::error::DOCKERHUB_TOKEN 与候选用户名都不匹配, 请在 env-config/.env 加 DOCKERHUB_USERNAME=真实用户名, 或检查令牌是否失效"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ steps.dh.outputs.user }}
          password: ${{ env.DOCKERHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/python
            docker.io/${{ steps.dh.outputs.user }}/python
          tags: |
            type=raw,value=latest
            type=raw,value=v26
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python
